name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tmux and shellcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck tmux
      - run: make check
