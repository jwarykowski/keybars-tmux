name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: localhost/forgejo-job:1
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: tmux
        run: apt-get update -q && apt-get install -y -q --no-install-recommends tmux
      - run: make check
